<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>ShadowEnglish</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    background: #f4f6f8;
    color: #17202a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    padding: 10px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 10px;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.logo span {
    color: #2563eb;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.status {
    color: #6b7280;
    font-size: 12px;
    white-space: nowrap;
}

/* =========================
   BACK TO HOME BUTTON
========================= */

.home-button {
    width: 42px;
    height: 42px;
    
    display: flex;
    align-items: center;
    justify-content: center;
    
    border: none;
    border-radius: 10px;
    
    background: transparent;
    
    color: inherit;
    text-decoration: none;
    
    font-size: 19px;
    
    cursor: pointer;
    
    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.home-button:hover {
    background: rgba(128, 128, 128, 0.12);
}

.home-button:active {
    transform: scale(0.92);
}
/* =========================================================
   SEARCH BUTTON
========================================================= */

.dictionary-button {
    width: 36px;
    height: 36px;

    border: 1px solid #d8dee7;
    border-radius: 8px;

    background: white;
    color: #17202a;

    font-size: 17px;

    cursor: pointer;
}

.dictionary-button:active {
    transform: scale(.94);
}


/* =========================================================
   URL INPUT
========================================================= */

.url-box {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.url-input {
    flex: 1;
    min-width: 0;

    height: 44px;

    padding: 0 13px;

    border: 1px solid #d7dde6;
    border-radius: 9px;

    background: #ffffff;
    color: #17202a;

    font-size: 14px;
    outline: none;
}

.url-input:focus {
    border-color: #2563eb;
}

.load-button {
    height: 44px;

    padding: 0 17px;

    border: 0;
    border-radius: 9px;

    background: #2563eb;
    color: white;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.load-button:active {
    transform: scale(.97);
}


/* =========================================================
   VIDEO
========================================================= */

.video-card {
    overflow: hidden;

    border-radius: 11px;

    background: #000000;

    box-shadow:
        0 2px 10px rgba(0,0,0,.08);
}

.video-wrapper {
    position: relative;

    width: 100%;
    aspect-ratio: 16 / 9;

    background: #000000;
}

#player {
    width: 100%;
    height: 100%;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 6px;

    padding: 9px;

    background: #111827;
}

.control-button {
    flex: 1;

    height: 40px;

    max-width: 140px;

    border: 0;
    border-radius: 8px;

    background: #293548;
    color: #ffffff;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;
}

.control-button.play {
    background: #2563eb;
}

.control-button:active {
    transform: scale(.96);
}


/* =========================================================
   A-B LOOP CONTROLS
========================================================= */

.loop-controls {
    display: flex;
    gap: 6px;

    padding: 8px 9px;

    background: #0c1422;

    border-top: 1px solid rgba(255,255,255,.06);
}

.loop-button {
    flex: 1;

    min-width: 0;

    height: 35px;

    border: 0;
    border-radius: 7px;

    background: #263246;
    color: white;

    font-size: 11px;
    font-weight: 700;

    cursor: pointer;
}

.loop-button.active {
    background: #2563eb;
}

.loop-button.stop {
    background: #7f1d1d;
}

.loop-time {
    display: flex;
    align-items: center;

    padding: 0 5px;

    color: #aeb8c7;

    font-size: 10px;
    white-space: nowrap;
}


/* =========================================================
   SETTINGS
========================================================= */

.settings {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-top: 9px;

    padding: 10px 12px;

    border: 1px solid #e0e5eb;
    border-radius: 9px;

    background: #ffffff;
}

.setting-title {
    font-size: 13px;
    font-weight: 700;
}

.setting-description {
    margin-top: 2px;

    color: #7b8491;

    font-size: 11px;
}

.quality-select {
    height: 35px;

    padding: 0 8px;

    border: 1px solid #d8dee7;
    border-radius: 7px;

    background: white;

    color: #17202a;

    font-size: 13px;
}


/* =========================================================
   SHADOWING PANEL
========================================================= */

.shadow-panel {
    overflow: hidden;

    margin-top: 10px;

    border: 1px solid #e0e5eb;
    border-radius: 11px;

    background: white;
}

.shadow-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 11px 12px;

    border-bottom: 1px solid #edf0f4;
}

.shadow-title {
    font-size: 16px;
    font-weight: 800;
}

.shadow-help {
    color: #7b8491;
    font-size: 11px;
}


/* =========================================================
   TRANSCRIPT
========================================================= */

.transcript {
    height: 300px;

    overflow-y: auto;

    padding: 9px;

    scroll-behavior: smooth;

    overscroll-behavior: contain;
}


/* =========================================================
   TRANSCRIPT LINE
========================================================= */

.transcript-line {
    display: block;

    padding: 9px 11px;

    margin-bottom: 5px;

    border-radius: 8px;

    color: #596273;

    font-size: 15px;
    line-height: 1.5;

    cursor: pointer;

    transition:
        background-color .18s ease,
        color .18s ease,
        font-size .18s ease,
        transform .18s ease;
}


/* =========================================================
   ACTIVE SPOKEN LINE
========================================================= */

.transcript-line.active {
    color: #2563eb;

    font-size: 17px;

    font-weight: 700;

    background: #edf4ff;

    transform: translateX(2px);
}


/* =========================================================
   CLICKABLE WORDS
========================================================= */

.transcript-word {
    display: inline;

    border-radius: 4px;

    cursor: pointer;

    transition:
        background-color .12s ease,
        color .12s ease;
}

.transcript-word:hover {
    background: #dceaff;
}

.transcript-word:active {
    background: #bfdbfe;
}


/* =========================================================
   TIMESTAMP
========================================================= */

.transcript-time {
    display: inline-block;

    min-width: 43px;

    margin-right: 7px;

    color: #98a2b3;

    font-size: 10px;
    font-weight: 600;

    vertical-align: middle;
}

.transcript-line.active
.transcript-time {
    color: #6b93e3;
}


/* =========================================================
   LINE LOOP BUTTON
========================================================= */

.line-loop-button {
    float: right;

    width: 27px;
    height: 25px;

    margin-left: 7px;

    border: 0;
    border-radius: 6px;

    background: #eef1f5;
    color: #667085;

    font-size: 12px;

    cursor: pointer;
}

.line-loop-button:hover {
    background: #dce8fb;
    color: #2563eb;
}

.line-loop-button.active {
    background: #2563eb;
    color: white;
}


/* =========================================================
   MESSAGE
========================================================= */

.transcript-message {
    padding: 35px 20px;

    text-align: center;

    color: #7b8491;

    font-size: 13px;
    line-height: 1.6;
}

.error-message {
    color: #b42318;
    background: #fff4f2;
}


/* =========================================================
   DICTIONARY MODAL
========================================================= */

.dictionary-overlay {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 15px;

    background: rgba(0,0,0,.58);

    pointer-events: auto;

    /* Prevents scroll chaining to background */
    touch-action: none;
    overscroll-behavior: contain;
}

.dictionary-overlay.open {
    display: flex;
}

.dictionary-modal {
    width: min(100%, 650px);

    max-height: min(820px, 92vh);

    overflow-y: auto;

    border-radius: 16px;

    background: #ffffff;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    /* Stops scrolling from propagating to parent page */
    overscroll-behavior: contain;
    touch-action: pan-y;
}


/* =========================================================
   DICTIONARY HEADER
========================================================= */

.dictionary-header {
    position: sticky;

    top: 0;

    z-index: 2;

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 13px;

    background: white;

    border-bottom: 1px solid #edf0f4;
}

.dictionary-search {
    flex: 1;

    min-width: 0;

    height: 42px;

    padding: 0 13px;

    border: 1px solid #d7dde6;

    border-radius: 8px;

    outline: none;

    font-size: 15px;
}

.dictionary-search:focus {
    border-color: #2563eb;
}

.dictionary-search-button {
    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

.dictionary-close {
    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 8px;

    background: #eef1f5;

    color: #344054;

    font-size: 20px;

    cursor: pointer;
}


/* =========================================================
   DICTIONARY CONTENT
========================================================= */

.dictionary-content {
    padding: 20px;
}

.dictionary-loading {
    padding: 35px 10px;

    text-align: center;

    color: #667085;

    font-size: 14px;
}


/* =========================================================
   WORD RESULT & GOOGLE STYLE CARD
========================================================= */

.word-heading {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    gap: 10px;
}

.word-title {
    margin: 0;

    font-size: 32px;

    line-height: 1.1;

    font-weight: 800;
}

.word-syllables {
    margin-top: 4px;

    color: #2563eb;

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 1px;
}

.word-type {
    margin-top: 2px;

    color: #667085;

    font-size: 13px;
}


/* =========================================================
   PRONUNCIATION (GOOGLE STYLE CARD)
========================================================= */

.pronunciation-card {
    display: flex;
    flex-wrap: wrap;

    gap: 10px;

    margin-top: 14px;

    padding: 12px;

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 10px;
}

.pronunciation-box {
    flex: 1;

    min-width: 140px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 12px;

    border-radius: 8px;

    background: white;

    border: 1px solid #edf2f7;
}

.pronunciation-info {
    display: flex;

    flex-direction: column;
}

.pronunciation-label {
    color: #2563eb;

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;
}

.pronunciation-value {
    margin-top: 2px;

    color: #334155;

    font-size: 15px;

    font-family: Arial, sans-serif;
}

.audio-button {
    height: 36px;

    padding: 0 12px;

    border: 0;

    border-radius: 18px;

    background: #eff6ff;

    color: #2563eb;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 4px;

    justify-content: center;

    transition: all 0.15s ease;
}

.audio-button:hover {
    background: #dbeafe;
}

.audio-button.playing {
    background: #2563eb;

    color: white;
}

.audio-button.error {
    background: #fef2f2;

    color: #ef4444;

    font-size: 11px;
}


/* =========================================================
   MEANING
========================================================= */

.meaning-section {
    margin-top: 18px;
}

.section-label {
    margin-bottom: 8px;

    color: #64748b;

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}

.meaning-item {
    margin-bottom: 12px;

    padding-bottom: 10px;

    border-bottom: 1px solid #f1f5f9;
}

.meaning-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

.meaning-part {
    display: inline-block;

    padding: 2px 6px;

    border-radius: 4px;

    background: #f1f5f9;

    color: #475569;

    font-size: 11px;

    font-weight: 700;

    margin-right: 6px;

    text-transform: lowercase;

    font-style: italic;
}

.meaning-text {
    color: #1e293b;

    font-size: 15px;

    line-height: 1.5;
}

.meaning-example {
    margin-top: 4px;

    color: #64748b;

    font-size: 13px;

    font-style: italic;
}


/* =========================================================
   HINDI MEANING
========================================================= */

.hindi-box {
    margin-top: 16px;

    padding: 13px;

    border-radius: 10px;

    background: #f0fdf4;

    border: 1px solid #bbf7d0;
}

.hindi-word {
    color: #15803d;

    font-size: 20px;

    font-weight: 700;
}


/* =========================================================
   DICTIONARY IMAGE
========================================================= */

.dictionary-image-container {
    margin-top: 16px;
}

.dictionary-image {
    display: block;

    width: 100%;

    max-height: 240px;

    object-fit: cover;

    border-radius: 10px;

    background: #eef1f5;

    border: 1px solid #e2e8f0;
}


/* =========================================================
   SEARCHED WORD HISTORY
========================================================= */

.history-section {
    margin-top: 20px;

    padding-top: 15px;

    border-top: 1px solid #edf0f4;
}

.history-list {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 6px;
}

.history-word {
    padding: 6px 10px;

    border: 1px solid #cbd5e1;

    border-radius: 15px;

    background: white;

    color: #334155;

    font-size: 12px;

    cursor: pointer;
}

.history-word:hover {
    background: #f1f5f9;

    border-color: #94a3b8;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .app {
        padding: 7px;
    }

    .url-box {
        flex-direction: column;
    }

    .load-button {
        width: 100%;
    }

    .transcript {
        height: 250px;
    }

    .transcript-line {
        font-size: 15px;
    }

    .transcript-line.active {
        font-size: 17px;
    }

    .control-button {
        max-width: none;
        font-size: 12px;
    }

    .loop-time {
        display: none;
    }

    .dictionary-overlay {
        align-items: flex-end;
        padding: 0;
    }

    .dictionary-modal {
        width: 100%;

        max-height: 88vh;

        border-radius:
            16px 16px 0 0;
    }

    .word-title {
        font-size: 26px;
    }

    .pronunciation-box {
        min-width: 100%;
    }

}

</style>
</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
====================================================== -->
<header class="header">

    <div class="logo">
        Shadow<span>English</span>
    </div>


    <div class="header-right">

        <div
            id="status"
            class="status"
        >
            Ready
        </div>


        <!-- BACK TO HOME -->

        <a
            href="../../index.html"
            class="home-button"
            aria-label="Back to Home"
            title="Back to Home"
        >
            🏠
        </a>


        <!-- DICTIONARY SEARCH -->

        <button
            id="dictionaryButton"
            class="dictionary-button"
            aria-label="Open dictionary"
            title="Dictionary"
        >
            🔎
        </button>

    </div>

</header>

<!-- =====================================================
     YOUTUBE URL
====================================================== -->

<section class="url-box">

    <input
        id="youtubeUrl"
        class="url-input"
        type="url"
        inputmode="url"
        autocomplete="off"
        placeholder="Paste a YouTube video URL..."
        aria-label="YouTube video URL"
    >

    <button
        id="loadButton"
        class="load-button"
    >
        Load Video
    </button>

</section>


<!-- =====================================================
     VIDEO
====================================================== -->

<section class="video-card">

    <div class="video-wrapper">

        <div id="player"></div>

    </div>


    <!-- MAIN CONTROLS -->

    <div class="controls">

        <button
            id="backButton"
            class="control-button"
        >
            −5 sec
        </button>


        <button
            id="playButton"
            class="control-button play"
        >
            ▶ Play
        </button>


        <button
            id="forwardButton"
            class="control-button"
        >
            +5 sec
        </button>

    </div>


    <!-- A-B LOOP -->

    <div class="loop-controls">

        <button
            id="setAButton"
            class="loop-button"
        >
            Set Point A
        </button>


        <button
            id="setBButton"
            class="loop-button"
        >
            Set Point B
        </button>


        <button
            id="stopLoopButton"
            class="loop-button stop"
        >
            Stop Loop
        </button>


        <div
            id="loopTime"
            class="loop-time"
        >
            A — B
        </div>

    </div>

</section>


<!-- =====================================================
     SETTINGS
====================================================== -->

<!-- <section class="settings">

    <div>

        <div class="setting-title">
            Data-saving mode
        </div>

        <div class="setting-description">
            YouTube chooses the actual available quality
        </div>

    </div>


    <select
        id="qualitySelect"
        class="quality-select"
    >

        <option value="low">
            Low / 360p preferred
        </option>

        <option value="auto">
            Auto
        </option>

    </select>

</section>

 --> 

<!-- =====================================================
     SHADOWING
====================================================== -->

<section class="shadow-panel">

    <div class="shadow-header">

        <div class="shadow-title">
            Shadowing
        </div>

        <div class="shadow-help">
            Listen → Read → Repeat
        </div>

    </div>


    <div
        id="transcript"
        class="transcript"
    >

        <div class="transcript-message">
            Paste a YouTube video above.
            Your transcript will be loaded automatically.
        </div>

    </div>

</section>


</div>


<!-- =====================================================
     DICTIONARY MODAL
====================================================== -->

<div
    id="dictionaryOverlay"
    class="dictionary-overlay"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
>


    <div
        id="dictionaryModal"
        class="dictionary-modal"
    >


        <!-- DICTIONARY SEARCH HEADER -->

        <div class="dictionary-header">

            <input
                id="dictionaryInput"
                class="dictionary-search"
                type="text"
                autocomplete="off"
                placeholder="Search an English word..."
                aria-label="Dictionary word"
            >


            <button
                id="dictionarySearchButton"
                class="dictionary-search-button"
            >
                🔎
            </button>


            <button
                id="dictionaryClose"
                class="dictionary-close"
                aria-label="Close dictionary"
            >
                ×
            </button>

        </div>


        <!-- RESULT -->

        <div
            id="dictionaryContent"
            class="dictionary-content"
        >

            <div class="dictionary-loading">
                Search a word to see its meaning.
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    transcriptAPI:
        "https://api.freetranscriptapi.com/v1/transcript",

    dictionaryAPI:
        "https://api.dictionaryapi.dev/api/v2/entries/en",

    datamuseAPI:
        "https://api.datamuse.com/words",

    translationAPIPrimary:
        "https://api.mymemory.translated.net/get",

    translationAPISecondary:
        "https://lingva.ml/api/v1/en/hi/",

    wikimediaAPI:
        "https://commons.wikimedia.org/w/api.php",

    unsplashSource:
        "https://source.unsplash.com/featured/?",

    language:
        "en",

    syncInterval:
        100

};


/* =========================================================
   STATE
========================================================= */

let player = null;

let playerReady = false;

let currentVideoId = null;

let currentVideoUrl = null;

let transcriptData = [];

let activeTranscriptIndex = -1;

let transcriptTimer = null;


/*
    A-B loop state.
*/

let pointA = null;

let pointB = null;

let abLoopActive = false;


/*
    Single transcript line loop.
*/

let lineLoopIndex = -1;

let lineLoopActive = false;


/*
    Prevent repeated seek operations.
*/

let lastLoopSeek = 0;


/*
    Active Audio Playback Manager (Ensures single playback)
*/

let currentAudioInstance = null;

let currentPlayingButton = null;


/* =========================================================
   DOM
========================================================= */

const urlInput =
    document.getElementById(
        "youtubeUrl"
    );

const loadButton =
    document.getElementById(
        "loadButton"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const forwardButton =
    document.getElementById(
        "forwardButton"
    );

const qualitySelect =
    document.getElementById(
        "qualitySelect"
    );

const transcriptElement =
    document.getElementById(
        "transcript"
    );

const statusElement =
    document.getElementById(
        "status"
    );


/*
    A-B controls.
*/

const setAButton =
    document.getElementById(
        "setAButton"
    );

const setBButton =
    document.getElementById(
        "setBButton"
    );

const stopLoopButton =
    document.getElementById(
        "stopLoopButton"
    );

const loopTimeElement =
    document.getElementById(
        "loopTime"
    );


/*
    Dictionary.
*/

const dictionaryButton =
    document.getElementById(
        "dictionaryButton"
    );

const dictionaryOverlay =
    document.getElementById(
        "dictionaryOverlay"
    );

const dictionaryModal =
    document.getElementById(
        "dictionaryModal"
    );

const dictionaryInput =
    document.getElementById(
        "dictionaryInput"
    );

/* =========================================================
   YOUTUBE ID EXTRACTION
========================================================= */

function extractYouTubeId(
    url
) {

    if (!url) {
        return null;
    }


    try {

        const parsed =
            new URL(url);


        if (
            parsed.hostname ===
                "youtube.com" ||

            parsed.hostname ===
                "www.youtube.com" ||

            parsed.hostname ===
                "m.youtube.com"
        ) {

            const videoId =
                parsed.searchParams.get(
                    "v"
                );


            if (videoId) {

                return cleanVideoId(
                    videoId
                );

            }


            const shorts =
                parsed.pathname.match(
                    /\/shorts\/([^/?]+)/
                );


            if (shorts) {

                return cleanVideoId(
                    shorts[1]
                );

            }


            const embed =
                parsed.pathname.match(
                    /\/embed\/([^/?]+)/
                );


            if (embed) {

                return cleanVideoId(
                    embed[1]
                );

            }

        }


        if (
            parsed.hostname ===
            "youtu.be"
        ) {

            return cleanVideoId(
                parsed.pathname
                    .replace(
                        /^\/+/,
                        ""
                    )
                    .split("/")[0]
            );

        }

    }

    catch (
        error
    ) {

        return null;

    }


    return null;

}


/* =========================================================
   CLEAN VIDEO ID
========================================================= */

function cleanVideoId(
    id
) {

    return String(id)
        .replace(
            /[^a-zA-Z0-9_-]/g,
            ""
        )
        .trim();

}


/* =========================================================
   LOAD VIDEO
========================================================= */

async function loadVideo() {

    const url =
        urlInput.value.trim();


    const videoId =
        extractYouTubeId(
            url
        );


    if (!videoId) {

        setStatus(
            "Invalid YouTube URL"
        );

        showTranscriptMessage(
            "Please enter a valid YouTube URL.",
            true
        );

        return;

    }


    currentVideoId =
        videoId;

    currentVideoUrl =
        url;


    stopAllLoops();


    transcriptData = [];

    activeTranscriptIndex = -1;


    showTranscriptMessage(
        "Loading transcript..."
    );


    setStatus(
        "Loading video..."
    );


    try {

        if (
            playerReady &&
            player
        ) {

            player.loadVideoById(
                videoId
            );

        }

        else {

            await waitForYouTube();

            createPlayer(
                videoId
            );

        }

    }

    catch (
        error
    ) {

        console.error(
            error
        );

        setStatus(
            "YouTube unavailable"
        );

    }


    loadTranscript(
        url
    );

}


/* =========================================================
   WAIT FOR YOUTUBE
========================================================= */

function waitForYouTube() {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            if (
                typeof YT !==
                    "undefined" &&
                YT.Player
            ) {

                resolve();

                return;

            }


            const started =
                Date.now();


            const timer =
                setInterval(
                    () => {

                        if (
                            typeof YT !==
                                "undefined" &&
                            YT.Player
                        ) {

                            clearInterval(
                                timer
                            );

                            resolve();

                            return;

                        }


                        if (
                            Date.now() -
                            started >
                            15000
                        ) {

                            clearInterval(
                                timer
                            );

                            reject(
                                new Error(
                                    "YouTube API timeout"
                                )
                            );

                        }

                    },
                    100
                );

        }
    );

}

   CREATE PLAYER

function createPlayer(

) {

    player =

            "player",

                playerVars: {

                    autoplay: 0,

                    playsinline: 1,

                    modestbranding: 1,

                    origin:

                },


                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    const state =
        player.getPlayerState();


    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

    }

    else {

        player.playVideo();

    }

}


/* =========================================================
   SEEK
========================================================= */

function seekBy(
    seconds
) {

    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    const current =
        player.getCurrentTime();


    const duration =
        player.getDuration();


    let target =
        current + seconds;


    target =
        Math.max(
            0,
            target
        );


    if (
        duration > 0
    ) {

        target =
            Math.min(
                duration,
                target
            );

    }


    player.seekTo(
        target,
        true
    );

}


/* =========================================================
   TRANSCRIPT API
========================================================= */

async function loadTranscript(
    youtubeUrl
) {

    try {

        setStatus(
            "Fetching transcript..."
        );


        const params =
            new URLSearchParams();


        params.set(
            "video_url",
            youtubeUrl
        );


        params.set(
            "lang",
            CONFIG.language
        );


        const endpoint =
            CONFIG.transcriptAPI +
            "?" +
            params.toString();


        const response =
            await fetch(
                endpoint,
                {
                    method:
                        "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    },

                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Transcript HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        transcriptData =
            normalizeTranscriptResponse(
                data
            );


        if (
            transcriptData.length === 0
        ) {

            throw new Error(
                "No timestamped transcript"
            );

        }


        renderTranscript();


        setStatus(
            "Transcript ready"
        );

    }

    catch (
        error
    ) {

        console.error(
            "Transcript error:",
            error
        );


        transcriptData = [];


        showTranscriptMessage(
            "Transcript unavailable for this video. " +
            "The video may not have captions, or the free " +
            "transcript service may be temporarily unavailable.",
            true
        );


        setStatus(
            "Transcript unavailable"
        );

    }

}


/* =========================================================
   NORMALIZE TRANSCRIPT
========================================================= */

function normalizeTranscriptResponse(
    data
) {

    let raw = [];


    if (
        Array.isArray(data)
    ) {

        raw = data;

    }

    else if (
        Array.isArray(
            data.transcript
        )
    ) {

        raw =
            data.transcript;

    }

    else if (
        data.data &&
        Array.isArray(
            data.data.transcript
        )
    ) {

        raw =
            data.data.transcript;

    }


    return raw
        .map(
            item => {

                let start =
                    Number(
                        item.start ??
                        item.start_seconds ??
                        item.startTime ??
                        item.offset ??
                        0
                    );


                let end =
                    Number(
                        item.end ??
                        item.end_seconds ??
                        item.endTime ??
                        NaN
                    );


                if (
                    item.start_ms !==
                    undefined
                ) {

                    start =
                        Number(
                            item.start_ms
                        ) / 1000;

                }


                if (
                    item.end_ms !==
                    undefined
                ) {

                    end =
                        Number(
                            item.end_ms
                        ) / 1000;

                }


                if (
                    !Number.isFinite(
                        end
                    ) &&
                    item.duration !==
                    undefined
                ) {

                    end =
                        start +
                        Number(
                            item.duration
                        );

                }


                if (
                    item.duration_ms !==
                    undefined
                ) {

                    end =
                        start +
                        (
                            Number(
                                item.duration_ms
                            ) / 1000
                        );

                }


                const text =
                    String(
                        item.text ??
                        item.caption ??
                        item.content ??
                        ""
                    ).trim();


                return {
                    start,
                    end,
                    text
                };

            }
        )
        .filter(
            item => {

                return (

                    Number.isFinite(
                        item.start
                    ) &&

                    Number.isFinite(
                        item.end
                    ) &&

                    item.end >
                    item.start &&

                    item.text.length >
                    0

                );

            }
        )
        .sort(
            (
                a,
                b
            ) =>
                a.start -
                b.start
        );

}


/* =========================================================
   RENDER TRANSCRIPT
========================================================= */

function renderTranscript() {

    transcriptElement.innerHTML =
        "";


    transcriptData.forEach(
        (
            line,
            index
        ) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "transcript-line";


            element.dataset.index =
                index;


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "transcript-time";


            time.textContent =
                formatTime(
                    line.start
                );


            element.appendChild(
                time
            );


            const loopButton =
                document.createElement(
                    "button"
                );


            loopButton.className =
                "line-loop-button";


            loopButton.textContent =
                "↻";


            loopButton.title =
                "Loop this line";


            loopButton.setAttribute(
                "aria-label",
                "Loop this transcript line"
            );


            loopButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    toggleLineLoop(
                        index
                    );

                }
            );


            element.appendChild(
                loopButton
            );


            const words =
                line.text.split(
                    /(\s+)/
                );


            words.forEach(
                part => {

                    if (
                        !part.trim()
                    ) {

                        element.appendChild(
                            document.createTextNode(
                                part
                            )
                        );

                        return;

                    }


                    const word =
                        document.createElement(
                            "span"
                        );


                    word.className =
                        "transcript-word";


                    word.textContent =
                        part;


                    word.title =
                        "Search this word";


                    word.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();


                            const clean =
                                cleanSearchWord(
                                    part
                                );


                            if (
                                clean
                            ) {

                                openDictionary(
                                    clean
                                );

                            }

                        }
                    );


                    element.appendChild(
                        word
                    );

                }
            );


            element.addEventListener(
                "click",
                () => {

                    if (
                        playerReady &&
                        player
                    ) {

                        player.seekTo(
                            line.start,
                            true
                        );

                        player.playVideo();

                    }

                }
            );


            transcriptElement.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   CLEAN WORD
========================================================= */

function cleanSearchWord(
    word
) {

    return String(word || "")
        .replace(
            /^[^a-zA-Z'-]+/,
            ""
        )
        .replace(
            /[^a-zA-Z'-]+$/,
            ""
        )
        .trim();

}


/* =========================================================
   TRANSCRIPT SYNC
========================================================= */

function startTranscriptSync() {

    if (
        transcriptTimer
    ) {

        clearInterval(
            transcriptTimer
        );

    }


    transcriptTimer =
        setInterval(
            updateTranscript,
            CONFIG.syncInterval
        );

}


/* =========================================================
   UPDATE TRANSCRIPT
========================================================= */

function updateTranscript() {

    if (
        !playerReady ||
        !player ||
        transcriptData.length ===
        0
    ) {

        return;

    }


    let currentTime;


    try {

        currentTime =
            player.getCurrentTime();

    }

    catch (
        error
    ) {

        return;

    }


    handleLoops(
        currentTime
    );


    if (
        activeTranscriptIndex >= 0 &&
        activeTranscriptIndex <
            transcriptData.length
    ) {

        const currentLine =
            transcriptData[
                activeTranscriptIndex
            ];


        if (
            currentTime >=
                currentLine.start &&

            currentTime <
                currentLine.end
        ) {

            return;

        }

    }


    const index =
        findTranscriptLine(
            currentTime
        );


    if (
        index ===
        activeTranscriptIndex
    ) {

        return;

    }


    setActiveLine(
        index
    );

}


/* =========================================================
   FIND TRANSCRIPT LINE
========================================================= */

function findTranscriptLine(
    time
) {

    let low = 0;

    let high =
        transcriptData.length - 1;


    while (
        low <= high
    ) {

        const middle =
            Math.floor(
                (
                    low +
                    high
                ) / 2
            );


        const line =
            transcriptData[
                middle
            ];


        if (
            time <
            line.start
        ) {

            high =
                middle - 1;

        }

        else if (
            time >=
            line.end
        ) {

            low =
                middle + 1;

        }

        else {

            return middle;

        }

    }


    return -1;

}


/* =========================================================
   ACTIVE LINE
========================================================= */

function setActiveLine(
    index
) {

    const previous =
        transcriptElement.querySelector(
            ".transcript-line.active"
        );


    if (
        previous
    ) {

        previous.classList.remove(
            "active"
        );

    }


    activeTranscriptIndex =
        index;


    if (
        index < 0
    ) {

        return;

    }


    const active =
        transcriptElement.querySelector(
            `[data-index="${index}"]`
        );


    if (
        !active
    ) {

        return;

    }


    active.classList.add(
        "active"
    );


    active.scrollIntoView({

        behavior:
            "smooth",

        block:
            "center",

        inline:
            "nearest"

    });

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    seconds
) {

    seconds =
        Math.max(
            0,
            Math.floor(
                seconds
            )
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    return (
        minutes +
        ":" +
        String(
            remaining
        ).padStart(
            2,
            "0"
        )
    );

}


/* =========================================================
   A-B LOOP
========================================================= */

function setPointA() {

    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    pointA =
        player.getCurrentTime();


    pointB = null;

    abLoopActive = false;


    disableLineLoop();


    updateLoopUI();


    setStatus(
        "Point A set"
    );

}


function setPointB() {

    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    const current =
        player.getCurrentTime();


    if (
        pointA === null
    ) {

        setStatus(
            "Set Point A first"
        );

        return;

    }


    if (
        current <= pointA
    ) {

        setStatus(
            "Point B must be after A"
        );

        return;

    }


    pointB =
        current;


    abLoopActive =
        true;


    disableLineLoop();


    updateLoopUI();


    setStatus(
        "A-B loop active"
    );

}


/* =========================================================
   HANDLE LOOPS
========================================================= */

function handleLoops(
    currentTime
) {

    if (
        abLoopActive &&
        pointA !== null &&
        pointB !== null
    ) {

        if (
            currentTime >=
            pointB
        ) {

            player.seekTo(
                pointA,
                true
            );

        }

    }


    if (
        lineLoopActive &&
        lineLoopIndex >= 0
    ) {

        const line =
            transcriptData[
                lineLoopIndex
            ];


        if (
            !line
        ) {

            return;

        }


        if (
            currentTime >=
            line.end
        ) {

            player.seekTo(
                line.start,
                true
            );

        }

    }

}


/* =========================================================
   SINGLE LINE LOOP
========================================================= */

function toggleLineLoop(
    index
) {

    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    if (
        lineLoopActive &&
        lineLoopIndex === index
    ) {

        disableLineLoop();

        setStatus(
            "Line loop stopped"
        );

        return;

    }


    abLoopActive =
        false;

    pointA = null;
    pointB = null;


    lineLoopIndex =
        index;

    lineLoopActive =
        true;


    updateLoopUI();


    const line =
        transcriptData[index];


    if (
        line
    ) {

        player.seekTo(
            line.start,
            true
        );

        player.playVideo();

    }


    setStatus(
        "Line loop active"
    );

}


/* =========================================================
   DISABLE LINE LOOP
========================================================= */

function disableLineLoop() {

    lineLoopActive =
        false;

    lineLoopIndex =
        -1;


    updateLoopUI();

}


/* =========================================================
   STOP ALL LOOPS
========================================================= */

function stopAllLoops() {

    abLoopActive =
        false;

    pointA = null;
    pointB = null;

    lineLoopActive =
        false;

    lineLoopIndex =
        -1;


    updateLoopUI();

}


/* =========================================================
   UPDATE LOOP UI
========================================================= */

function updateLoopUI() {

    setAButton.classList.toggle(
        "active",
        pointA !== null
    );


    setBButton.classList.toggle(
        "active",
        abLoopActive
    );


    if (
        pointA !== null &&
        pointB !== null
    ) {

        loopTimeElement.textContent =
            "A " +
            formatTime(pointA) +
            " → B " +
            formatTime(pointB);

    }

    else if (
        pointA !== null
    ) {

        loopTimeElement.textContent =
            "A " +
            formatTime(pointA) +
            " → ?";

    }

    else {

        loopTimeElement.textContent =
            "A — B";

    }


    const buttons =
        transcriptElement.querySelectorAll(
            ".line-loop-button"
        );


    buttons.forEach(
        (
            button,
            index
        ) => {

            const line =
                button.parentElement;


            const lineIndex =
                Number(
                    line.dataset.index
                );


            const active =
                lineLoopActive &&
                lineIndex ===
                lineLoopIndex;


            button.classList.toggle(
                "active",
                active
            );

            button.textContent =
                active ?
                "■" :
                "↻";

        }
    );

}


/* =========================================================
   DICTIONARY — OPEN
========================================================= */

function openDictionary(

    dictionaryOverlay.classList.add(

function pauseVideoForDictionary() {

/* =========================================================

function closeDictionary() {

    );

/* =========================================================
   GOOGLE-STYLE SYLLABLE BREAKDOWN GENERATOR
========================================================= */

function getGoogleStyleSyllables(word) {

    word = word.toLowerCase().trim();

    if (word.length <= 3) return word;


    const vowelGroups = word.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi);


    if (!vowelGroups || vowelGroups.length <= 1) {

        return word;

    }


    // Splitting rule heuristics for Google-style syllable dots
    const syllables = [];

    let current = "";


    for (let i = 0; i < word.length; i++) {

        current += word[i];

        const isVowel = /[aeiouy]/.test(word[i]);

        const nextIsVowel = i + 1 < word.length && /[aeiouy]/.test(word[i + 1]);

        const secondIsVowel = i + 2 < word.length && /[aeiouy]/.test(word[i + 2]);


        if (isVowel && !nextIsVowel && secondIsVowel && i < word.length - 2) {

            syllables.push(current);

            current = "";

        } else if (!isVowel && !nextIsVowel && secondIsVowel && i < word.length - 2) {

            syllables.push(current);

            current = "";

        }

    }


    if (current) syllables.push(current);


    return syllables.length > 1 ? syllables.join("·") : word;

}


/* =========================================================
   DICTIONARY SEARCH — MULTI SOURCE RESILIENT
========================================================= */

async function searchDictionary(
    inputWord
) {

    stopAllAudioPlayback();


    const word =
        cleanSearchWord(
            inputWord
        ).toLowerCase();


    if (
        !word
    ) {

        return;

    }


    saveSearchedWord(
        word
    );


    dictionaryContent.innerHTML =
        `
        <div class="dictionary-loading">
            Looking up <strong>${escapeHTML(word)}</strong>...
        </div>
        `;


    let info = null;

    let hindi = null;

    let imageUrl = null;


    // 1. Fetch Dictionary Info with Primary & Secondary Fallback
    try {

        info = await fetchPrimaryDictionary(word);

    } catch (e) {

        console.warn("Primary dictionary failed, using Datamuse fallback...", e);

        try {

            info = await fetchSecondaryDictionary(word);

        } catch (e2) {

            console.warn("Secondary dictionary failed too", e2);

        }

    }


    // 2. Fetch Hindi Translation independently
    try {

        hindi = await fetchHindiTranslation(word);

    } catch (e) {

        console.warn("Hindi translation failed", e);

        hindi = "Translation unavailable";

    }


    // 3. Fetch Image lookup independently
    try {

        imageUrl = await fetchWikimediaImage(word);

        if (!imageUrl) {

            imageUrl = await fetchUnsplashImage(word);

        }

    } catch (e) {

        console.warn("Image fetch failed", e);

    }


    // Render results even if some services failed
    if (info || hindi || imageUrl) {

        renderDictionaryResult(
            word,
            info || {
                ukPhonetic: `/${word}/`,
                usPhonetic: `/${word}/`,
                ukAudio: `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(word)}-uk.mp3`,
                usAudio: `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(word)}-us.mp3`,
                meanings: []
            },

            hindi || "Translation unavailable",

            imageUrl

        );

    } else {

        dictionaryContent.innerHTML =
            `
            <div class="dictionary-loading error-message">
                No result could be retrieved for <strong>${escapeHTML(word)}</strong>.
                <br><br>
                Please check your internet connection or try another word.
            </div>
            `;

    }

}


/* =========================================================
   PRIMARY DICTIONARY API
========================================================= */

async function fetchPrimaryDictionary(word) {

    const response = await fetch(
        CONFIG.dictionaryAPI + "/" + encodeURIComponent(word)
    );


    if (!response.ok) {

        throw new Error("Primary API returned " + response.status);

    }


    const entries = await response.json();

    return parseDictionaryEntries(entries, word);

}


/* =========================================================
   SECONDARY DICTIONARY API (DATAMUSE FALLBACK)
========================================================= */

async function fetchSecondaryDictionary(word) {

    const response = await fetch(
        CONFIG.datamuseAPI + "?sp=" + encodeURIComponent(word) + "&md=d&max=1"
    );


    if (!response.ok) {

        throw new Error("Datamuse API returned " + response.status);

    }


    const data = await response.json();


    if (!data || data.length === 0 || !data[0].defs) {

        throw new Error("No Datamuse definition found");

    }


    const meanings = data[0].defs.map(defStr => {

        const parts = defStr.split("\t");

        return {
            part: parts[0] || "meaning",
            definition: parts[1] || defStr,
            example: ""
        };

    });


    return {
        ukPhonetic: `/${word}/`,
        usPhonetic: `/${word}/`,
        ukAudio: `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(word)}-uk.mp3`,
        usAudio: `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(word)}-us.mp3`,
        meanings: meanings
    };

}


/* =========================================================
   PARSE DICTIONARY
========================================================= */

function parseDictionaryEntries(entries, word) {

    let ukPhonetic = "";

    let usPhonetic = "";

    let ukAudio = "";

    let usAudio = "";

    let firstAudio = "";

    let firstText = "";

    const meanings = [];


    if (!Array.isArray(entries)) {

        return {
            ukPhonetic: `/${word}/`,
            usPhonetic: `/${word}/`,
            ukAudio: "",
            usAudio: "",
            meanings: []
        };

    }


    entries.forEach(entry => {

        if (entry && Array.isArray(entry.phonetics)) {

            entry.phonetics.forEach(phonetic => {

                if (!phonetic) return;

                const text = phonetic.text || "";

                const audio = phonetic.audio || "";


                if (audio && !firstAudio) firstAudio = audio;

                if (text && !firstText) firstText = text;


                const lower = audio.toLowerCase();


                if (lower.includes("-uk") || lower.includes("_uk") || lower.includes("uk/")) {

                    if (!ukAudio) ukAudio = audio;

                    if (!ukPhonetic && text) ukPhonetic = text;

                } else if (lower.includes("-us") || lower.includes("_us") || lower.includes("us/")) {

                    if (!usAudio) usAudio = audio;

                    if (!usPhonetic && text) usPhonetic = text;

                } else {

                    if (!ukPhonetic && text) ukPhonetic = text;

                    if (!usPhonetic && text) usPhonetic = text;

                }

            });

        }


        if (entry && Array.isArray(entry.meanings)) {

            entry.meanings.forEach(meaning => {

                if (!meaning) return;

                const part = meaning.partOfSpeech || "";

                const definitions = Array.isArray(meaning.definitions) ? meaning.definitions : [];


                definitions.slice(0, 3).forEach(definition => {

                    if (!definition) return;

                    meanings.push({

                        part: part,

                        definition: definition.definition || "",

                        example: definition.example || ""

                    });

                });

            });

        }

    });


    const generalPhonetic = entries[0]?.phonetic || firstText || `/${word}/`;


    if (!ukPhonetic) ukPhonetic = generalPhonetic;

    if (!usPhonetic) usPhonetic = generalPhonetic;

    if (!ukAudio) ukAudio = firstAudio || `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(word)}-uk.mp3`;

    if (!usAudio) usAudio = firstAudio || `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(word)}-us.mp3`;


    return {
        ukPhonetic,
        usPhonetic,
        ukAudio,
        usAudio,
        meanings
    };

}


/* =========================================================
   HINDI TRANSLATION WITH FALLBACK
========================================================= */

async function fetchHindiTranslation(word) {

    // Primary Translation: MyMemory
    try {

        const response = await fetch(
            CONFIG.translationAPIPrimary + "?q=" + encodeURIComponent(word) + "&langpair=en|hi"
        );


        if (response.ok) {

            const data = await response.json();

            if (data.responseData?.translatedText) {

                return data.responseData.translatedText;

            }

        }

    } catch (e) {

        console.warn("Primary translation service failed", e);

    }


    // Secondary Translation: Lingva Fallback
    try {

        const response = await fetch(CONFIG.translationAPISecondary + encodeURIComponent(word));

        if (response.ok) {

            const data = await response.json();

            if (data.translation) {

                return data.translation;

            }

        }

    } catch (e) {

        console.warn("Secondary translation service failed", e);

    }


    return "Translation unavailable";

}


/* =========================================================
   IMAGE LOOKUPS (PRIMARY & SECONDARY)
========================================================= */

async function fetchWikimediaImage(word) {

    try {

        const params = new URLSearchParams({
            action: "query",
            generator: "search",
            gsrsearch: word,
            gsrnamespace: "6",
            gsrlimit: "1",
            prop: "imageinfo",
            iiprop: "url",
            iiurlwidth: "500",
            format: "json",
            origin: "*"
        });


        const response = await fetch(CONFIG.wikimediaAPI + "?" + params.toString());

        if (!response.ok) return null;


        const data = await response.json();

        const pages = data.query?.pages;

        if (!pages) return null;


        const first = Object.values(pages)[0];

        return first?.imageinfo?.[0]?.thumburl || first?.imageinfo?.[0]?.url || null;

    } catch (e) {

        return null;

    }

}


async function fetchUnsplashImage(word) {

    return `${CONFIG.unsplashSource}${encodeURIComponent(word)}`;

}

/* =========================================================
   RESILIENT SINGLE-AUDIO MANAGER & SPEECH ENGINE
========================================================= */

function stopAllAudioPlayback() {

    // 1. Stop MP3 Audio
    if (currentAudioInstance) {

        try {

            currentAudioInstance.pause();

            currentAudioInstance.currentTime = 0;

        } catch (e) {}

        currentAudioInstance = null;

    }


    // 2. Cancel Speech Synthesis Voice
    if ("speechSynthesis" in window) {

        try {

            window.speechSynthesis.cancel();

        } catch (e) {}

    }


    // 3. Reset Button Visual State
    if (currentPlayingButton) {

        currentPlayingButton.classList.remove("playing", "error");

        currentPlayingButton.innerHTML = "🔊 Listen";

        currentPlayingButton = null;

    }

}


async function handleAudioClick(buttonBtn, word, audioUrl, langCode) {

    // Stop any active audio/speech immediately
    stopAllAudioPlayback();


    currentPlayingButton = buttonBtn;

    buttonBtn.classList.add("playing");

    buttonBtn.innerHTML = "🔊 Playing...";


    // Strategy 1: Direct MP3 Audio Playback
    if (audioUrl && audioUrl.startsWith("http")) {

        try {

            const audio = new Audio(audioUrl);

            currentAudioInstance = audio;


            audio.onended = () => {

                stopAllAudioPlayback();

            };


            audio.onerror = () => {

                console.warn("MP3 playback failed, resorting to SpeechSynthesis fallback...");

                playSpeechSynthesisFallback(buttonBtn, word, langCode);

            };


            await audio.play();

            return;

        } catch (e) {

            console.warn("Direct MP3 play rejected, trying SpeechSynthesis...", e);

        }

    }


    // Strategy 2: Fallback to SpeechSynthesis
    playSpeechSynthesisFallback(buttonBtn, word, langCode);

}


function playSpeechSynthesisFallback(buttonBtn, word, langCode) {

    const spoke = speakText(word, langCode, () => {

        stopAllAudioPlayback();

    });


    if (!spoke) {

        buttonBtn.classList.remove("playing");

        buttonBtn.classList.add("error");

        buttonBtn.innerHTML = "❌ Audio Error";


        setTimeout(() => {

            stopAllAudioPlayback();

        }, 2000);

    }

}


function speakText(text, lang = "en-US", onEndCallback = null) {

    if (!("speechSynthesis" in window)) {

        return false;

    }


    try {

        window.speechSynthesis.cancel();


        const utterance = new SpeechSynthesisUtterance(text);

        utterance.lang = lang;

        utterance.rate = 0.85;


        const voices = window.speechSynthesis.getVoices();

        const match = voices.find(v => v.lang.startsWith(lang) || v.lang.includes(lang.replace("-", "_")));


        if (match) {

            utterance.voice = match;

        }


        utterance.onend = () => {

            if (onEndCallback) onEndCallback();

        };


        utterance.onerror = () => {

            if (onEndCallback) onEndCallback();

        };


        window.speechSynthesis.speak(utterance);

        return true;

    } catch (e) {

        console.error("Speech synthesis failed", e);

        return false;

    }

}


// Pre-initialize browser speech synthesis engine voices

/* =========================================================
   LOCAL STORAGE
========================================================= */

const WORD_STORAGE_KEY =
    "shadowEnglishSearchedWords";


function getSearchedWords() {

    try {

        const stored =
            localStorage.getItem(
                WORD_STORAGE_KEY
            );


        if (
            !stored
        ) {

            return [];

        }


        const words =
            JSON.parse(
                stored
            );


        return Array.isArray(words)
            ? words
            : [];

    }

    catch (
        error
    ) {

        return [];

    }

}


/* =========================================================
   SAVE SEARCHED WORD
========================================================= */

function saveSearchedWord(
    word
) {

    word =
        word.toLowerCase().trim();


    if (
        !word
    ) {

        return;

    }


    let words =
        getSearchedWords();


    words =
        words.filter(
            item =>
                item !== word
        );


    words.unshift(
        word
    );


    words =
        words.slice(
            0,
            100
        );


    try {

        localStorage.setItem(
            WORD_STORAGE_KEY,
            JSON.stringify(words)
        );

    }

    catch (
        error
    ) {

        console.warn(
            "localStorage unavailable:",
            error
        );

    }

}


/* =========================================================
   SEARCH HISTORY
========================================================= */

function renderSearchHistory() {

    const words =
        getSearchedWords();


    if (
        words.length === 0
    ) {

        return "";

    }


    const buttons =
        words
            .slice(0, 15)
            .map(
                word => {

                    return `
                    <button
                        class="history-word"
                        onclick="searchHistoryWord('${escapeAttribute(word)}')"
                    >
                        ${escapeHTML(word)}
                    </button>
                    `;

                }
            )
            .join("");


    return `
        <div class="history-section">

            <div class="section-label">
                Recent Searches
            </div>

            <div class="history-list">
                ${buttons}
            </div>

        </div>
    `;

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(
    value
) {

    return String(value || "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "&#039;"
        )
        .replace(
            /"/g,
            "&quot;"
        );

}
